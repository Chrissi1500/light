name: Fahrradlicht-APK bauen

on:
  push:
    paths: ['fahrradlicht/**', 'esp32/licht.py', '.github/workflows/fahrradlicht.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: APK bauen
        working-directory: fahrradlicht
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Fahrradlicht-APK
          path: fahrradlicht/app/build/outputs/apk/release/app-release.apk
