plugins { id 'com.android.application' }

android {
    namespace 'de.esp32claude'
    compileSdk 35
    defaultConfig {
        applicationId 'de.esp32claude'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        // Fester Schluessel, damit spaetere Updates ueber die alte Version installiert werden koennen.
        release {
            storeFile file('esp32claude.keystore')
            storePassword 'esp32claude'
            keyAlias 'esp32claude'
            keyPassword 'esp32claude'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
    sourceSets { main { assets.srcDirs += ['build/generated/espAssets'] } }
}

// ESP32-Agent-Dateien aus ../../esp32 in die App packen (fuer "Agent per USB installieren")
tasks.register('copyEspFiles', Copy) {
    from('../../esp32') { include 'agent.py', 'main.py' }
    into 'build/generated/espAssets/esp32'
}
preBuild.dependsOn copyEspFiles

dependencies {
    implementation 'com.anthropic:anthropic-java:3.9.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
